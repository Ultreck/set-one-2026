<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <!-- What is HTML Canvas? -->
    <!-- The HTML <canvas> element is used to draw graphics on a web page. It is a container for graphics, which can be drawn using JavaScript. The <canvas> element does not have any drawing capabilities of its own; instead, it provides a surface on which you can use JavaScript to draw shapes, text, images, and other graphics. -->

        <canvas id="myCanvas" width="200" height="100" style="border:1px solid #000000;">
            Your browser does not support the HTML canvas tag.
        </canvas>

        <!-- SVG (Scalable vector graphics) -->
        <svg width="300" height="400" style="border:1px solid #000000;">
            
            <rect width="200" height="100" fill="lightblue" />
            <circle cx="50" cy="50" r="40" fill="red" />
            <!-- <dot cx="150" cy="50" r="40" fill="green" /> -->
            <ellipse cx="150" cy="50" rx="40" ry="20" fill="green" />
            <path d="M 10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80" stroke="black" fill="transparent"/>
            <polygon points="100,10 40,198 190,78 10,78 160,198" fill="purple" />
            <line x1="0" y1="0" x2="200" y2="100" stroke="black" />
            <text x="100" y="50" font-size="20" text-anchor="middle" fill="white">SVG</text>
            
            
            
            <defs>
                <linearGradient id="grad1">
                    <stop offset="0%" stop-color="yellow" />
                    <stop offset="100%" stop-color="red" />
                </linearGradient>
            </defs>
            <ellipse cx="100" cy="90" rx="80" ry="60" fill="url(#grad1)" />
            <text x="100" y="50" font-size="20" text-anchor="middle" fill="white">SVG</text>
        </svg>

</body>
</html>
