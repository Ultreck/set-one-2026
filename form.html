<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form {
            background-color: lightgray;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
         input[type="submit"]:hover {
            background-color: darkblue; 
        }
    </style>
</head>
<body>
    <!-- An HTML form is used to collect user input. The user input is most sent to a server for processing -->

    <form action="" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br> <!-- Here inputs and br are self-closing tags -->

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        
        <!-- Radio buttons -->
        <label for="password">Radio button:</label>
            <label for="password">HTML:</label>
            <input type="radio" id="html" name="fav_language" value="HTML"><br><br>
            <label for="password">CSS:</label>
            <input type="radio" id="css" name="fav_language" value="CSS"><br><br>
            <label for="password">JavaScript:</label>
            <input type="radio" id="javascript" name="fav_language" value="JavaScript"><br><br>
            <label for="password">Python:</label>
            <input type="radio" id="python" name="fav_language" value="Python"><br><br>

<!-- Checkboxes -->
            <label for="password">Favorite food:</label>
            <label for="password">Swallow:</label>
            <input type="checkbox" id="swallow" name="fav_food" value="Swallow"><br><br>
            <label for="password">Fried rice:</label>
            <input type="checkbox" id="fried_rice" name="fav_food" value="Fried rice"><br><br>
            <label for="password">Noodles:</label>
            <input type="checkbox" id="noodles" name="fav_food" value="Noodles"><br><br>
            
            
            <input type="button" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="color" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="date" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="file" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="hidden" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="image" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="month" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="number" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="range" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="reset" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="search" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="tel" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="time" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="week" id="noodles" name="fav_food" value="Noodles"><br><br>
            <input type="url" id="noodles" name="fav_food" value="Noodles"><br><br>

        <input type="submit" value="Submit">

        <textarea name="message" rows="3" cols="20">
            Enter your message here...  
        </textarea>

        <select name="cars" id="cars">
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
        </select>
    </form>
